[package]
name = "fidan-codegen-llvm"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
llvm-toolchain-23 = [
  "dep:fidan-ast",
  "dep:fidan-stdlib",
  "dep:inkwell",
  "dep:llvm-sys",
  "inkwell/llvm23-1",
]

[dependencies]
anyhow = { workspace = true }
fidan-lexer = { workspace = true }
fidan-mir = { workspace = true }
fidan-ast = { workspace = true, optional = true }
fidan-stdlib = { workspace = true, optional = true }
inkwell = { workspace = true, optional = true }
llvm-sys = { version = "231", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The official Windows static libraries interpose rpmalloc on the host CRT.
# Link the supplied LLVM-C DLL instead, using its import library in build.rs.
[target.'cfg(windows)'.dependencies]
llvm-sys = { version = "231", optional = true, features = ["no-llvm-linking"] }

[dev-dependencies]
fidan-ast = { workspace = true }
fidan-source = { workspace = true }
