name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Bootstrap smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/scripts/test-bootstrap-windows.ps1

      - name: Windows release pipeline regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/scripts/test-release-windows.ps1

      - name: Build
        run: cargo build --workspace --locked

      - name: Toolchain packaging environment regression
        shell: pwsh
        run: |
          ./test/scripts/test-toolchain-build-env.ps1

      - name: Formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
