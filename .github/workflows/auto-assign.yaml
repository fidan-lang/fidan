name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: "Auto-assign issue"
        uses: pozil/auto-assign-issue@7bf9d82c77d45976224660b873fc83e60576c5aa # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: AppSolves
          numOfAssignee: 1
