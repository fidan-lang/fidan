name: Release Distribution

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package (defaults to workspace version)"
        required: false
        type: string
      publish:
        description: "Upload artifacts and manifest to R2"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: releases
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Package release artifact
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ runner.os == 'Windows' && secrets.CERT_PFX_BASE64 || '' }}
          CERT_PASSWORD: ${{ runner.os == 'Windows' && secrets.CERT_PASSWORD || '' }}
          WF_GITHUB_EVENT_NAME: ${{ github.event_name }}
          WF_GITHUB_REF_NAME: ${{ github.ref_name }}
          WF_INPUTS_VERSION: ${{ inputs.version }}
        run: |
          . ./scripts/shared/release-inputs.ps1
          $version = Get-WorkflowReleaseVersion -EventName $env:WF_GITHUB_EVENT_NAME -RefName $env:WF_GITHUB_REF_NAME -RequestedVersion $env:WF_INPUTS_VERSION
          if ($version) {
            ./scripts/package-release.ps1 -Version $version
          } else {
            ./scripts/package-release.ps1
          }

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.os }}
          path: dist/release

  bundle:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: build
    environment: releases
    if: ${{ needs.build.result == 'success' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Fetch existing manifest if present
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          if aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "manifest.json" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            if aws s3 cp "s3://$R2_BUCKET/manifest.json" dist/release/existing-manifest.json \
              --endpoint-url "$R2_ENDPOINT" \
              --no-progress; then
              echo "Fetched existing manifest from R2"
            else
              echo "Remote manifest exists but could not be fetched from R2" >&2
              exit 1
            fi
          else
            status_code="$(curl -sS -o /dev/null -w "%{http_code}" "https://releases.fidan.dev/manifest.json" || true)"
            if [ "$status_code" = "404" ]; then
              echo "No existing manifest present yet"
            elif [ -z "$status_code" ] || [ "$status_code" = "000" ]; then
              echo "Failed to probe existing manifest state" >&2
              exit 1
            else
              echo "Remote manifest appears to exist but could not be read from R2" >&2
              exit 1
            fi
          fi

      - name: Merge distribution manifest
        shell: pwsh
        run: |
          if (Test-Path "dist/release/existing-manifest.json") {
            ./scripts/merge-distribution-manifest.ps1 `
              -FragmentsRoot "dist/release/fragments" `
              -ExistingManifestPath "dist/release/existing-manifest.json" `
              -OutputPath "dist/release/manifest.json"
          } else {
            ./scripts/merge-distribution-manifest.ps1 `
              -FragmentsRoot "dist/release/fragments" `
              -OutputPath "dist/release/manifest.json"
          }

      - name: Upload merged distribution bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distribution-bundle
          path: dist/release

  publish:
    permissions:
      contents: write
    name: Publish to R2
    runs-on: ubuntu-latest
    needs: bundle
    concurrency:
      group: distribution-manifest-publication
      cancel-in-progress: false
    if: ${{ github.event_name == 'push' || inputs.publish }}
    environment: releases

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distribution-bundle
          path: dist/release

      - name: Publish immutable payload and conditional manifest
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: python3 scripts/publish-distribution.py dist/release

      - name: Publish GitHub release assets
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/release/payload/fidan/**/*.tar.gz
            dist/release/payload/fidan/**/*.exe
          body_path: dist/release/release-notes.md
          generate_release_notes: false
          make_latest: true
          append_body: true

  winget:
    name: Submit winget manifest
    needs: publish
    if: ${{ github.event_name == 'push' && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/submit-winget.yaml
    with:
      version: ${{ github.ref_name }}
    secrets:
      WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
